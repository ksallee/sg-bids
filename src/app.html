<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The icons: `pnpm og` writes the PNGs and the .ico from static/favicon.svg. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f5" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1f25" />
		%sveltekit.head%
		<!-- The scheme before the first paint, under the page's CSP. A file: see static/theme.js. -->
		<script src="/theme.js"></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
